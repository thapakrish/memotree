[project]
name = "memotree-import-api"
version = "0.1.0"
description = "FastAPI backend for MemoTree shared chat imports"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "playwright>=1.54.0",
  "uvicorn>=0.35.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
